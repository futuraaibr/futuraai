name: Internal validation

on:
  pull_request:
  push:
    branches:
      - main
      - codex/pretest-financial-integrity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  financial-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run regression and integration checks
        run: npm run check
